name: Build Windows Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to build
        required: true
        default: v1.0.0

permissions:
  contents: read

concurrency:
  group: tec-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  windows-release:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - name: Check out the released tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.9.13'
          architecture: x64
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Use an unambiguous Windows temp directory
        shell: pwsh
        run: |
          $tempRoot = Join-Path $env:RUNNER_TEMP 'qchip-tec'
          New-Item -ItemType Directory -Path $tempRoot -Force | Out-Null
          foreach ($name in @('TEMP', 'TMP', 'TMPDIR')) {
            "$name=$tempRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Install locked build dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run offline tests
        shell: pwsh
        run: |
          python scripts/collect_notices.py node_modules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/run_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check first-install script with offline fixtures
        shell: powershell
        run: ./tests/test_install.ps1
      - name: Build and verify release assets
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Use a stable vMAJOR.MINOR.PATCH release tag.'
          }
          $version = $env:RELEASE_TAG.Substring(1)
          python scripts/build_release.py --version $version --tag $env:RELEASE_TAG --output artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('Qchip-TEC-Windows-x64.zip', 'update.json', 'SHA256SUMS.txt')) {
            if (-not (Test-Path (Join-Path artifacts $name))) { throw "Missing release asset: $name" }
          }
      - name: Attach the verified program and manifest to this release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload $env:RELEASE_TAG artifacts/Qchip-TEC-Windows-x64.zip artifacts/update.json artifacts/SHA256SUMS.txt --repo $env:GH_REPO
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
