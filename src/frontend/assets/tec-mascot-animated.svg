<svg viewBox="0 0 420 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TEC mascot">
<style>.tec-body { transform-origin: 209px 269px; }
.tec-face { transform-origin: 208px 177px; }
.tec-coolHand { transform-origin: 123px 198px; }
.tec-thermometer { transform-origin: 295px 208px; }
.tec-warmth { transform-origin: 350px 76px; }
@media (prefers-reduced-motion: no-preference){
  .tec-body { animation: breathe 5.8s ease-in-out infinite; }
  .tec-face { animation: look 6.7s ease-in-out -.8s infinite; }
  .tec-coolHand { animation: wave 4.6s ease-in-out -.6s infinite; }
  .tec-thermometer { animation: balance 5.4s ease-in-out -1.2s infinite; }
  .tec-warmth { animation: rise 3.4s ease-in-out infinite; }
}
@keyframes breathe { 0%,100% { transform: translateY(1px) rotate(-.6deg); } 50% { transform: translateY(-4px) rotate(.7deg); } }
@keyframes look { 0%,100% { transform: translateX(-1px); } 50% { transform: translateX(1.5px); } }
@keyframes wave { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(4deg); } }
@keyframes balance { 0%,100% { transform: rotate(3deg); } 50% { transform: rotate(-3deg); } }
@keyframes rise { 0%,100% { transform: translateY(1px); opacity: .6; } 50% { transform: translateY(-4px); opacity: 1; } }
</style>
